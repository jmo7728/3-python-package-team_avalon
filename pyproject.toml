[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eatnyc"
version = "0.1.0"
description = "A tiny NYC restaurant recommender near NYU."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{
    name = Team Avalon
}]
keywords = ["nyc", "restaurants", "fun", "food", recommendations]

[tool.setuptools]
package_dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

